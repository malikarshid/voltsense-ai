version: '3.8'

services:
  # Python FastAPI Backend with ML Engine & Battery Simulator
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltsense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./voltsense.db
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - SECRET_KEY=voltsense_production_secret_key_2026
    depends_on:
      - mqtt-broker
    restart: unless-stopped

  # Next.js 14 Responsive Automotive Dashboard & 3D WebGL Twin
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voltsense-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Eclipse Mosquitto MQTT Broker for Hardware / ESP32 Ingestion
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: voltsense-mqtt
    ports:
      - "1883:1883"
    restart: unless-stopped
